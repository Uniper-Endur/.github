name: Update Code Quality Table

on:
  push:
    paths:
      - 'scripts/update-code-quality.ps1'
      - '.github/workflows/update-code-quality.yml'

  workflow_dispatch:

  schedule:
    # Every day at 06:30 UTC
    - cron: '30 6 * * *'

permissions:
  contents: write

jobs:
  update-code-quality:

    runs-on: ubuntu-latest

    env:
      GITHUB_ORG: ur

    steps:

      # ------------------------------------------------------
      # Checkout profile repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN }}

      # ------------------------------------------------------
      # Install GitHub CLI
      # ------------------------------------------------------

      - name: Verify GitHub CLI
        run: |
          gh --version

      # ------------------------------------------------------
      # Authenticate GitHub CLI
      # ------------------------------------------------------

      - name: Authenticate GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh auth status --hostname github.com

      # ------------------------------------------------------
      # Update Code Quality table
      # ------------------------------------------------------

      - name: Update Code Quality table
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_ORG: ${{ env.GITHUB_ORG }}
        run: |
          ./scripts/update-code-quality.ps1

      # ------------------------------------------------------
      # Check README changes
      # ------------------------------------------------------

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------
      # Commit and push
      # ------------------------------------------------------

      - name: Commit and push README
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/README.md

          git commit -m "chore: update code quality table"

          git push
