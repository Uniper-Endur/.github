name: Update Repository Table

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/update-repo-table.ps1'
      - '.github/workflows/update-repo-table.yml'
  schedule:
    # Scheduled workflows run from the repository default branch; this automation assumes that branch is main.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-repo-table:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Ensure target branch is main
        shell: bash
        run: |
          if [ "${TARGET_BRANCH}" != "main" ]; then
            echo "This workflow expects the repository default branch to be main." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}

      - name: Ensure manual runs target main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "${TARGET_BRANCH}" ]; then
            echo "Run this workflow from the ${TARGET_BRANCH} branch." >&2
            exit 1
          fi

      - name: Verify required tools
        run: |
          gh --version
          pwsh --version

      - name: Update repository table
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ORG: ${{ github.repository_owner }}
        run: ./scripts/update-repo-table.ps1

      - name: Commit README changes
        shell: bash
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "profile/README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore: update repository table"
          git push origin HEAD:${TARGET_BRANCH}
