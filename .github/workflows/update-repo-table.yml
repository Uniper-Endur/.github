name: Update Repository Table

on:
  push:
    paths:
      - 'scripts/update-repo-table.ps1'
      - '.github/workflows/update-repo-table.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository table update
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          ./scripts/update-repo-table.ps1

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes detected."
          else
            git commit -m "chore: update repository table"
            git push
          fi
